; Every Bullpen service in the RunPod pod: the chat model, the store, the engine and the bot. Logs go to the
; container log, which RunPod shows. With BULLPEN_POD_ROLE=models start.sh sets BULLPEN_RUN_APPS=false
; and only the model runs.
; With BULLPEN_MODELS_API_KEY set, the model server listens on every interface and requires that key.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:chat]
command=sh -c '/app/llama-server -hf %(ENV_BULLPEN_CHAT_GGUF)s --host $BULLPEN_MODELS_HOST --port 8000 ${BULLPEN_MODELS_API_KEY:+--api-key $BULLPEN_MODELS_API_KEY} --ctx-size %(ENV_BULLPEN_CHAT_CTX)s --parallel %(ENV_BULLPEN_CHAT_PARALLEL)s --cache-type-k q8_0 --cache-type-v q8_0 --flash-attn on --n-gpu-layers 99 --jinja --metrics || { sleep 30; exit 1; }'
directory=/app
stopasgroup=true
killasgroup=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:store]
autostart=%(ENV_BULLPEN_RUN_APPS)s
command=/usr/local/bin/store
priority=30
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:engine]
autostart=%(ENV_BULLPEN_RUN_APPS)s
command=/usr/local/bin/engine
priority=40
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:discord]
autostart=%(ENV_BULLPEN_RUN_APPS)s
command=/usr/local/bin/discord
priority=50
startretries=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
